# Types, lint and tests on every push to main and every pull request (one
# `turbo run check` over all packages); then coverage and a Sonar scan when the
# SONAR_TOKEN secret is set.
name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Sonar needs the history to tell new code from old

      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Expo writes expo-env.d.ts and the typed-routes file (.expo/types/router.d.ts)
      # when its dev server starts; the type check needs both. Start it, wait
      # for the file, stop it.
      - name: Generate Expo types
        working-directory: apps/mobile
        run: |
          CI=1 ./node_modules/.bin/expo start --port 8099 > expo-start.log 2>&1 &
          for i in $(seq 1 90); do [ -f .expo/types/router.d.ts ] && break; sleep 1; done
          kill $! 2>/dev/null || true
          test -f expo-env.d.ts && test -f .expo/types/router.d.ts || { cat expo-start.log; exit 1; }

      - name: Cache Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Check (types, lint, tests)
        run: pnpm turbo run check --cache-dir=.turbo

      - name: Coverage
        if: env.SONAR_TOKEN != ''
        run: pnpm test:coverage

      - name: Cache Sonar packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Sonar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
