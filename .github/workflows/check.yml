# Types, lint and tests (with coverage) on every push to main and every pull
# request; then a Sonar scan when the SONAR_TOKEN secret is set.
name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Sonar needs the history to tell new code from old

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backup-server/package-lock.json

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix backup-server

      # Expo writes expo-env.d.ts and the typed-routes file (.expo/types/router.d.ts)
      # when its dev server starts; the type check needs both. Start it, wait
      # for the file, stop it.
      - name: Generate Expo types
        run: |
          CI=1 ./node_modules/.bin/expo start --port 8099 > expo-start.log 2>&1 &
          for i in $(seq 1 90); do [ -f .expo/types/router.d.ts ] && break; sleep 1; done
          kill $! 2>/dev/null || true
          test -f expo-env.d.ts && test -f .expo/types/router.d.ts || { cat expo-start.log; exit 1; }

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:coverage

      - name: Cache Sonar packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Sonar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
