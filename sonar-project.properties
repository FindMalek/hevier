# SonarQube Cloud (sonarcloud.io), run by .github/workflows/check.yml.
sonar.projectKey=hamzaamry_hevier
sonar.organization=hamzaamry
sonar.projectName=Hevier
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=**/*.test.ts,node_modules/**,**/node_modules/**,coverage/**,android/**,catalogue/**,docs/**,assets/**,scripts/local/**,.expo/**,**/build/**
sonar.tests=.
sonar.test.inclusions=**/*.test.ts
sonar.test.exclusions=node_modules/**,**/node_modules/**,scripts/local/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Screens, components, hooks and the native modules have no unit tests (no UI
# test setup), so they don't count towards coverage. They are still analysed.
sonar.coverage.exclusions=app/**,components/**,hooks/**,modules/**,types/**,**/*.d.ts,plugins/**,scripts/design/**,scripts/widgets/**,scripts/build-hevy-names.ts,**/*.config.*
