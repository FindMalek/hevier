packages:
  - apps/*
  - packages/*

# One version of each shared dev tool, referenced as "catalog:" in the packages.
catalog:
  "@types/node": ^26.6.5
  "@vitest/coverage-v8": ^5.0.4
  eslint: ^9.0.0
  typescript: ~6.0.3
  vitest: ^5.0.4

# esbuild (via tsx and vitest) is the only dependency with an install script we allow.
onlyBuiltDependencies:
  - esbuild
