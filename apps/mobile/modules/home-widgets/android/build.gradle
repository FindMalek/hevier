plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.hevier'
version = '1.0.0'

android {
  namespace "expo.modules.homewidgets"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

// PathParser draws the Recovery body from MuscleMap's SVG path data.
dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
}
